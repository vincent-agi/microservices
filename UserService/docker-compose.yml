services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: user-api-dev
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - user-db
    networks:
      - microservices-network
    labels:
      # Activer Traefik pour ce service
      - "traefik.enable=true"
      
      # Router pour /auth (authentification)
      - "traefik.http.routers.user-auth.rule=Host(`localhost`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.user-auth.entrypoints=web"
      - "traefik.http.routers.user-auth.service=user-api"
      - "traefik.http.routers.user-auth.priority=20"
      
      # Router pour /users (CRUD utilisateurs)
      - "traefik.http.routers.user-api.rule=Host(`localhost`) && PathPrefix(`/api/users`)"
      - "traefik.http.routers.user-api.entrypoints=web"
      - "traefik.http.routers.user-api.service=user-api"
      - "traefik.http.routers.user-api.priority=10"
      
      # Configuration du service (unique pour les deux routers)
      - "traefik.http.services.user-api.loadbalancer.server.port=3000"
      
      # Middleware CORS
      - "traefik.http.middlewares.user-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.user-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,Accept"
      - "traefik.http.middlewares.user-cors.headers.accesscontrolalloworiginlist=http://localhost:3001,http://localhost,http://ui.localhost"
      - "traefik.http.middlewares.user-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.user-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.user-cors.headers.accesscontrolallowcredentials=true"
      
      # Middleware pour strip prefix /api -> / (garde /auth et /users intacts)
      - "traefik.http.middlewares.user-stripprefix.stripprefix.prefixes=/api"
      
      # Chaîne de middlewares (CORS + StripPrefix)
      - "traefik.http.routers.user-auth.middlewares=user-cors,user-stripprefix"
      - "traefik.http.routers.user-api.middlewares=user-cors,user-stripprefix"

  user-db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: user-mysql-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - user_mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - microservices-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: user-phpmyadmin
    restart: always
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: 3306
    ports:
      - "8083:80"
    depends_on:
      - user-db
    networks:
      - microservices-network

networks:
  microservices-network:
    external: true

volumes:
  user_mysql_data:
